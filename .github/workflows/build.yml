name: Build EXE

on:
  push:
    branches: [main]
    paths:
      - "discord_badge_idler.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the dummy game runner (C#)
        shell: pwsh
        run: |
          python -c "import pathlib, discord_badge_idler as m; pathlib.Path('BadgeIdlerRunner.cs').write_text(m.RUNNER_SOURCE, encoding='utf-8-sig')"
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /noconfig /target:winexe /optimize+ /codepage:65001 /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /out:BadgeIdlerRunner.exe BadgeIdlerRunner.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }

      - name: Install Nuitka
        run: python -m pip install --upgrade nuitka ordered-set zstandard

      - name: Compile the app with Nuitka
        run: >-
          python -m nuitka
          --onefile
          --assume-yes-for-downloads
          --enable-plugin=tk-inter
          --windows-console-mode=disable
          --include-data-files=BadgeIdlerRunner.exe=BadgeIdlerRunner.exe
          --company-name=DiscordBadgeIdler
          --product-name=DiscordBadgeIdler
          --file-description=DiscordBadgeIdler
          --file-version=1.3.0.0
          --product-version=1.3.0.0
          --output-dir=build
          --output-filename=DiscordBadgeIdler.exe
          discord_badge_idler.py

      - name: Upload the EXE as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBadgeIdler
          path: build/DiscordBadgeIdler.exe

      - name: Publish the "latest" release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag
          if ($LASTEXITCODE -ne 0) { Write-Host "No previous release to replace." }
          gh release create latest build/DiscordBadgeIdler.exe --title "Discord Badge Idler (latest build)" --notes "Built automatically from commit $env:GITHUB_SHA." --target $env:GITHUB_SHA
