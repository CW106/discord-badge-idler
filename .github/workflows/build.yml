name: Build EXE

on:
  push:
    branches: [main]
    paths:
      - "discord_badge_idler.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to build (empty = latest main)"
        required: false
        default: ""
      exe:
        description: "Build the ZIP and EXE (versions before 1.3 can't be built)"
        type: boolean
        default: true
      latest:
        description: "Mark this release as Latest"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_EXE: ${{ github.event_name == 'push' || inputs.exe }}
      MAKE_LATEST: ${{ github.event_name == 'push' || inputs.latest }}
    steps:
      - name: Get the workflow and the changelog
        uses: actions/checkout@v4

      - name: Get the code to build
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          path: src

      - name: Read the version
        shell: pwsh
        run: |
          $text = Get-Content -Raw -Encoding utf8 src/discord_badge_idler.py
          if ($text -match '(?m)^VERSION = "([0-9.]+)"') { $version = $Matches[1] } else { throw "VERSION not found" }
          $commit = "$(git -C src rev-parse HEAD)".Trim()
          Write-Host "Version $version at $commit (EXE: $env:BUILD_EXE, latest: $env:MAKE_LATEST)"
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_COMMIT=$commit" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Set up Python
        if: env.BUILD_EXE == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile the dummy game runner (C#)
        if: env.BUILD_EXE == 'true'
        shell: pwsh
        working-directory: src
        run: |
          python -c "import pathlib, discord_badge_idler as m; pathlib.Path('BadgeIdlerRunner.cs').write_text(m.RUNNER_SOURCE, encoding='utf-8-sig')"
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /noconfig /target:winexe /optimize+ /codepage:65001 /r:System.dll /r:System.Drawing.dll /r:System.Windows.Forms.dll /out:BadgeIdlerRunner.exe BadgeIdlerRunner.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }

      - name: Install Nuitka
        if: env.BUILD_EXE == 'true'
        run: python -m pip install --upgrade nuitka ordered-set zstandard

      - name: Compile the app with Nuitka (ZIP folder and single EXE)
        if: env.BUILD_EXE == 'true'
        shell: pwsh
        working-directory: src
        run: |
          $parts = @($env:APP_VERSION.Split(".") | Where-Object { $_ -match '^\d+$' })
          while ($parts.Count -lt 4) { $parts += "0" }
          $fileVersion = $parts[0..3] -join "."
          Write-Host "Building version $env:APP_VERSION ($fileVersion)"
          $common = @(
            "--assume-yes-for-downloads",
            "--enable-plugin=tk-inter",
            "--windows-console-mode=disable",
            "--include-data-files=BadgeIdlerRunner.exe=BadgeIdlerRunner.exe",
            "--company-name=DiscordBadgeIdler",
            "--product-name=DiscordBadgeIdler",
            "--file-description=DiscordBadgeIdler",
            "--file-version=$fileVersion",
            "--product-version=$fileVersion",
            "--output-filename=DiscordBadgeIdler.exe"
          )
          $hasIcon = python -c "import discord_badge_idler as m; print(hasattr(m, 'make_icon_ico'))"
          if ("$hasIcon".Trim() -eq "True") {
            python -c "import pathlib, discord_badge_idler as m; pathlib.Path('app.ico').write_bytes(m.make_icon_ico())"
            if ($LASTEXITCODE -ne 0) { throw "Couldn't make the icon" }
            $common += "--windows-icon-from-ico=app.ico"
          }

          # Folder version, shipped as a ZIP. It runs in place, so antivirus programs flag it less often.
          python -m nuitka --standalone @common --output-dir=folder discord_badge_idler.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka (folder version) failed" }
          Rename-Item folder/discord_badge_idler.dist DiscordBadgeIdler
          New-Item -ItemType Directory -Force build | Out-Null
          Compress-Archive -Path folder/DiscordBadgeIdler -DestinationPath build/DiscordBadgeIdler.zip

          # Single EXE. It unpacks itself to a temp folder every time it starts.
          python -m nuitka --onefile @common --output-dir=build discord_badge_idler.py
          if ($LASTEXITCODE -ne 0) { throw "Nuitka (single EXE) failed" }
          Get-ChildItem build -File | Format-Table Name, Length

      - name: Smoke test (start both versions and check they work)
        if: env.BUILD_EXE == 'true'
        shell: pwsh
        working-directory: src
        run: |
          $unzipped = Join-Path $env:RUNNER_TEMP "unzipped"
          Expand-Archive build/DiscordBadgeIdler.zip -DestinationPath $unzipped
          $targets = [ordered]@{
            "ZIP folder" = (Join-Path $unzipped "DiscordBadgeIdler\DiscordBadgeIdler.exe")
            "single EXE" = (Join-Path (Get-Location) "build\DiscordBadgeIdler.exe")
          }
          $env:BADGE_IDLER_LANG = "en"
          $failed = @()
          $n = 0
          foreach ($name in $targets.Keys) {
            $n++
            $exe = $targets[$name]
            Write-Host "=== $name ($exe)"
            $data = Join-Path $env:RUNNER_TEMP "smoke$n"
            $env:BADGE_IDLER_DATA = $data
            $ok = $false
            if (Test-Path $exe) {
              Start-Process -FilePath $exe
              $log = Join-Path $data "log.txt"
              for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
                Start-Sleep -Seconds 2
                $ok = (Test-Path $log) -and (Select-String -Path $log -SimpleMatch "bundled with the app" -Quiet)
              }
              if (Test-Path $log) { Get-Content $log }
              $crash = Join-Path $data "crash_log.txt"
              if (Test-Path $crash) { Get-Content $crash; $ok = $false }
              $app = @(Get-Process -Name DiscordBadgeIdler -ErrorAction SilentlyContinue)
              if ($app.Count -eq 0) { Write-Host "The app is not running."; $ok = $false }
              $runner = Join-Path $data "runner\BadgeIdlerRunner.exe"
              if (Test-Path $runner) {
                $game = Start-Process -FilePath $runner -ArgumentList "--title", "SmokeTest" -PassThru
                Start-Sleep -Seconds 3
                if ($game.HasExited) { Write-Host "The dummy game runner exited early."; $ok = $false } else { Stop-Process -Id $game.Id -Force }
              } else { Write-Host "The dummy game runner was not set up."; $ok = $false }
              $app | Stop-Process -Force -ErrorAction SilentlyContinue
              for ($i = 0; $i -lt 10 -and @(Get-Process -Name DiscordBadgeIdler -ErrorAction SilentlyContinue).Count -gt 0; $i++) {
                Get-Process -Name DiscordBadgeIdler -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
                Start-Sleep -Seconds 1
              }
            } else { Write-Host "Missing: $exe" }
            if ($ok) { Write-Host "$name passed." } else { $failed += $name }
          }
          if ($failed.Count -gt 0) { throw "Smoke test failed: $($failed -join ', ')" }
          Write-Host "Smoke test passed."

      - name: Upload the builds as an artifact
        if: env.BUILD_EXE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DiscordBadgeIdler-v${{ env.APP_VERSION }}
          path: |
            src/build/DiscordBadgeIdler.zip
            src/build/DiscordBadgeIdler.exe

      - name: Publish the release for this version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          $title = "Discord Badge Idler $tag"
          $notes = New-Object System.Collections.Generic.List[string]
          $inside = $false
          foreach ($line in (Get-Content -Encoding utf8 CHANGELOG.md)) {
            if ($line -match '^## ') {
              if ($inside) { break }
              $inside = ($line.Trim() -eq "## $tag")
              continue
            }
            if ($inside) { $notes.Add($line) }
          }
          $notes.Add("")
          $notes.Add("---")
          if ($env:BUILD_EXE -eq 'true') {
            $notes.Add("**推薦下載 DiscordBadgeIdler.zip**：解壓縮後，打開資料夾裡的 DiscordBadgeIdler.exe（Windows 10／11）。單一檔案的 DiscordBadgeIdler.exe 也能用，但比較容易被防毒軟體誤判成病毒。被擋下的話請看 [README](https://github.com/CW106/discord-badge-idler/blob/main/README.zh-TW.md#被防毒擋下怎麼辦)。")
            $notes.Add("")
            $notes.Add("**Recommended: DiscordBadgeIdler.zip.** Extract it and run DiscordBadgeIdler.exe in the folder (Windows 10/11). The single-file DiscordBadgeIdler.exe works too, but antivirus programs flag it more often. If it gets blocked, see the [README](https://github.com/CW106/discord-badge-idler/blob/main/README.md#if-your-antivirus-blocks-it).")
          } else {
            $notes.Add("這個版本只有 Python 版：下載下面的 Source code，解壓縮後雙擊 start.bat（需要 Python 3）。")
            $notes.Add("Python only: download the source code below, unzip it and double-click start.bat (needs Python 3).")
          }
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          $latest = if ($env:MAKE_LATEST -eq 'true') { "--latest" } else { "--latest=false" }

          gh release delete latest --yes --cleanup-tag -R $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { Write-Host "No old 'latest' release to remove." }

          gh release view $tag -R $env:GITHUB_REPOSITORY --json tagName
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag -R $env:GITHUB_REPOSITORY --title $title --notes-file $notesFile $latest
            if ($LASTEXITCODE -ne 0) { throw "Couldn't update the release" }
            if ($env:BUILD_EXE -eq 'true') {
              gh release upload $tag src/build/DiscordBadgeIdler.zip src/build/DiscordBadgeIdler.exe --clobber -R $env:GITHUB_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw "Couldn't upload the files" }
            }
          } else {
            $files = @()
            if ($env:BUILD_EXE -eq 'true') { $files = @("src/build/DiscordBadgeIdler.zip", "src/build/DiscordBadgeIdler.exe") }
            gh release create $tag @files -R $env:GITHUB_REPOSITORY --title $title --notes-file $notesFile --target $env:APP_COMMIT $latest
            if ($LASTEXITCODE -ne 0) { throw "Couldn't create the release" }
          }
